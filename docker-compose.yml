services:
  # =========================
  # db: PostgreSQL コンテナ
  # =========================
  db:
    # Docker Hub の CDN が不安定なので Google ミラーから取得（中身は同じ postgres:16）
    image: mirror.gcr.io/library/postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # app: Rails アプリ コンテナ
  # =========================
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/rails server -b 0.0.0.0
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      RAILS_ENV: development
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

# =========================
# Docker が管理する永続データの宣言
# =========================
volumes:
  postgres_data:
  bundle_cache:
